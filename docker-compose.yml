services:
  postgres:
    image: postgres:17-alpine
    container_name: mc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: morningcoffee
      POSTGRES_USER: mc
      POSTGRES_PASSWORD: mc_local_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d morningcoffee"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
